# ---------------------------------------------------------------------------------------------
# IC1 settings that replace the former post-build patches (tools/patch_*.py, docs/STANDARD_model_patches.md)
# ---------------------------------------------------------------------------------------------
# Annual cumulative budgets (atmosphere CO2 budget, CO2-storage site caps, biomass stocks) are
# debited once per representative block while flows are weighted to a full year; divide them
# by this factor. 365 for daily representative periods, 1.0 for a full-year chronological run.
representative_period_scaling: 365

# Per-country NEW-BUILD caps in GW (workbook global_constraints_industry_case_study.xlsx,
# set_technology_buildout, TYNDP2024). Alternative Base; existing plants excluded.
# Countries without candidate units in the model are skipped.
technology_buildout_by_country:
  nuclear-3:
    NL: {2030: 0, 2040: 4, 2050: 5}
    BE: {2030: 0, 2040: 6, 2050: 6}
    UK: {2030: 6, 2040: 11, 2050: 13}
    NO: {2030: 0, 2040: 0, 2050: 0}
    DE: {2030: 0, 2040: 0, 2050: 0}
    DK: {2030: 0, 2040: 0, 2050: 0}
    FR: {2030: 0, 2040: 6, 2050: 27}
    LU: {2030: 0, 2040: 0, 2050: 0}

# Explicit case decisions (entity = regex on the entity name).
set_parameters:
  - {class: unit, entity: "^gas-extraction_NL", parameter: availability_factor, value: 0.0}   # Groningen closed
  - {class: unit, entity: "^DAC_", parameter: investment_count_max_cumulative, value: 0.0}  # no DAC in the IC1 baseline
  - {class: unit, entity: "^DAC_", parameter: existing_units, value: 0.0}  # DAC has no existing_units in the data, so SpineOpt would otherwise default it to 1

# Forced retirement of endowed industrial incumbents where an alternative route can meet demand.
retire_industry:
  active: True
  region_regex: "_((?:BE|NL)C\\d|DE|DK|NO|UK|FR|LU)$"
  carrier_regex: "^(elec|heat|cool|CO2|CH4|H2|bio|atmosphere|HC|MeOH|oil|coal|LNG|U-92|water|waste|gas|wind|solar|nuclear|battery|hydro)"

# Give every yearly 2030/2041/2050 series a 2040-01-01 point equal to the 2041 value.
align_milestones_to_periods: True
