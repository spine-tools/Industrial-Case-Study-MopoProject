scenarios:
  # GA_flex0 not GA_flex5: our transport pipeline emits flex scenarios 0/10/20, the EU pipeline 0/5/10.
  # high_CO2 carries storages_fix_cumulative for the CO2 storage nodes; without it sequestration is uncapped.
  baseline_blended_representative_periods: ["Base","wy2009","medium_bio","current","GA","GA_flex0","low_CO2",flex_buildings,flex_buildings_wy2009_current,flex_industry] 
emission_factor: 1.0 #percentage of carbon budget considered in the model based on the included countries
# balance_penalty on the atmosphere node. Set to null once the model solves without it.
#
# The 2050/2060 atmosphere caps are exactly 0.0, which makes the atmosphere node_state
# upper bound a hard zero. That looks like a guaranteed infeasibility, but it is NOT:
# the EU reference case has the identical structure (2030=520, 2041=116, 2050=0, 2060=0)
# and it solved with NO balance_penalty at all. Net zero is reached through the CCS
# chain - atmosphere -> CO2-injection-* -> CO2-storage-* - not by relaxing the budget.
# IC1 has that chain intact and better provisioned than EU: 6 injection routes (EU: 2)
# and 27.2 units of 2050 sequestration capacity (EU: 4.5) against a 165.4 budget (EU: 520).
#
# So do NOT floor the carbon budget to force feasibility. Doing so would hide a broken
# CCS chain behind a fake "overshoot" number. If the model does turn out infeasible,
# diagnose the CCS chain first; only then consider slack, and report it explicitly.
co2_overshoot_penalty: 10000
resolution: "1h"
# operations_* blocks: one timestep per year (former make_tiny_model.py). Required for correct
# *_cumulative budgets and the representative_period_scaling below. Remove to keep 1h.
operations_resolution: "365D"
# Representative days pinned for clustering (1-based day of year), used by tools/make_cluster_seed.py
# (Toolbox tool make_cluster_seed). The count sets the number of representative periods.
representative_weather_year: "wy2009"
representative_days: [134, 253, 358]
future_inflation: 0.03
default_technology_discount_rate: 0.05
economic_reference_year: 2025
solver: "HiGHS.jl" # Gurobi.jl - IC1 stays on HiGHS to keep the toolchain open source
# configurable cyclic condition, storage options: battery-storage-iron-air,batter-storage,truck-DR,bus-DR,van-DR,car-DR
long-term-storage: [battery-storage-iron-air]
short-term-storage: [battery-storage,PH-reservoir,truck-DR,bus-DR,van-DR,car-DR]
ratio_ground_air_HP: 0.3
include_biomass_potential_limitations: True
biomass_potential_realistic: 0.5
no_investable_2030:
  # Here we define the technologies that cannot be built by 2030 so then they cannot be investable in that year since there is no enough time for the construction.
  unit:
    - nuclear-3
    - SCPC
    - SCPC+CC
    - waste-ST
    - SMR
    - SMR+CC
    - (BM)MeOH
    - (COEL)MeOH-MEA
    - (H2)MeOH-DC
    - DAC
  connection:
    - H2
    - elec
  node:
    - salt-cavern

set_industry_buildings_flex: True
industry_buildings_flex:
  comfort_buildings: 4.0
  comfort_industry: 2.0
  flex_buildings: 0.1
  flex_industry: 0.1

set_technology_buildout: True
technology_buildout:
  nuclear-3: 
    2030: 120.0
    2040: 150.0
    2050: 180.0 # GW

set_limited_commodity: True
limited_commodity:
  # Source: verification/global_constraints_industry_case_study.xlsx, sheet
  # "scenario_config.yaml", block "limited_commodity".
  # The Pan-EU figures (2500000 / 1000000 / 500000 GWh) are scaled by the
  # six-country share of the Pan-EU CO2 budget:
  #     1,146,352,500 / 2,600,000,000 = 0.44090480769
  # giving the values below. NOTE this ratio is specific to the SIX-country
  # mixed-resolution run (NL BE NO DE DK UK). A BE+NL-only run would use
  # 165,400,000 / 2,600,000,000 = 0.0636 -> 159000 / 63600 / 31800 GWh.
  #
  # WARNING - currently INERT. limit_commodity() writes these under the
  # alternative "limited_fossil-CH4", which is NOT in the
  # baseline_blended_representative_periods scenario list above, so nothing is
  # applied. Add it to that list to activate.
  # HAZARD when activating: the value lands on node storage_state_max with
  # storage_longterm_active=True. Long-term storage caps carry a verified 365x
  # defect (docs/FINDING_biomass_cap_365x_CONFIRMED.md). Verify whether this
  # budget needs /365 BEFORE trusting results.
  fossil-CH4:
    2030: 1102262.0
    2040: 440904.8
    2050: 220452.4 # GWh

include_ramping: False
ramping:
  nuclear-3: 
    - elec
    - 0.07
  CCGT: 
